<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card template — Coach Swapnil</title>
<!-- Not part of the site. This is the source used to render assets/og-image.jpg:
     load it at exactly 1200x630 and screenshot. Rendering the card in the
     browser rather than compositing it means it uses the real brand fonts and
     the real tokens, so it can never drift from the site.
     Disallowed in robots.txt; nothing links to it. -->
<link rel="stylesheet" href="css/styles.css?v=23">
<link rel="stylesheet" href="css/components.css?v=23">
<link rel="stylesheet" href="css/layout.css?v=23">
<style>
  html,body{margin:0;padding:0;background:#0B0B0D;overflow:hidden}
  .og{
    position:relative;width:1200px;height:630px;overflow:hidden;
    background-color:var(--black-1);
    background-image:url('assets/hero-studio.webp'),var(--hero-grad);
    background-size:cover,auto;
    background-position:center 40%,center;
    background-blend-mode:soft-light;
    display:flex;align-items:center;
  }
  /* Same watermark, scrim and grain the hero uses. */
  .og__watermark{
    position:absolute;inset:0;z-index:1;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:900;font-size:210px;
    letter-spacing:-0.03em;color:rgba(90,20,11,0.55);
    text-transform:uppercase;line-height:0.85;text-align:center;user-select:none;
  }
  .og__photo{
    position:absolute;right:2%;bottom:0;height:100%;z-index:2;
    -webkit-mask-image:linear-gradient(to bottom,#000 94%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 94%,transparent 100%);
  }
  .og__photo img{height:100%;width:auto;display:block}
  .og__scrim{
    position:absolute;inset:0;z-index:3;
    background:
      linear-gradient(96deg,rgba(5,5,6,0.95) 0%,rgba(5,5,6,0.84) 30%,rgba(5,5,6,0.36) 54%,transparent 72%),
      linear-gradient(to top,rgba(5,5,6,0.8) 0%,transparent 40%);
  }
  .og__grain{position:absolute;inset:0;z-index:5;background:var(--grain);opacity:0.1}
  .og__body{position:relative;z-index:4;padding:0 0 0 64px;max-width:660px}
  .og .wordmark{--logo-tile:44px;--logo-name:22px;margin-bottom:38px}
  .og h1{
    font-size:82px;line-height:0.94;margin:0 0 26px;
    letter-spacing:-0.025em;color:#fff;
  }
  .og__meta{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    font-family:var(--font-body);font-size:19px;font-weight:700;
    letter-spacing:0.1em;text-transform:uppercase;color:#fff;
  }
  .og__meta i{width:6px;height:6px;border-radius:50%;background:var(--ember-500);flex:none}
  .og__price{color:var(--ember-400)}
</style>
</head>
<body>
<div class="og">
  <div class="og__watermark" aria-hidden="true">Coach<br>Swapnil</div>
  <div class="og__photo"><img src="assets/swapnil-hero.webp" alt=""></div>
  <div class="og__scrim"></div>

  <div class="og__body">
    <span class="wordmark">
      <span class="wordmark__mark"><span>S</span></span>
      <span class="wordmark__type">
        <span class="wordmark__pre">Coach</span>
        <span class="wordmark__name">Swapnil</span>
      </span>
    </span>
    <h1>Forge Your<br>Best Self</h1>
    <div class="og__meta">
      <span>Batches of 4&ndash;6</span><i></i>
      <span>20+ Years</span><i></i>
      <span class="og__price">From &#8377;4,000/mo</span>
    </div>
  </div>

  <div class="og__grain"></div>
</div>
</body>
</html>
